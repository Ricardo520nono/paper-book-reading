<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="g4" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/><stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/><stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/><stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fee2e2"/><stop offset="100%" stop-color="#fecaca"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Figure 1 · FinGPT 四层架构（Claude 重绘）</text>
  <text x="450" y="50" text-anchor="middle" font-size="13" fill="#6b7280">Application / LLM / Data Curation / Data Source — 每层独立可换</text>

  <!-- Layer 4: Application -->
  <rect x="60" y="80" width="780" height="100" rx="14" fill="url(#g4)" stroke="#d97706" stroke-width="1.5"/>
  <text x="80" y="108" font-size="13" font-weight="700" fill="#92400e">④ APPLICATION LAYER</text>
  <g transform="translate(140 130)">
    <rect width="180" height="40" rx="8" fill="#fff" stroke="#d97706"/>
    <text x="90" y="25" text-anchor="middle" font-size="13" fill="#92400e">Robo-Advisor</text>
  </g>
  <g transform="translate(360 130)">
    <rect width="180" height="40" rx="8" fill="#fff" stroke="#d97706"/>
    <text x="90" y="25" text-anchor="middle" font-size="13" fill="#92400e">Sentiment for Quant</text>
  </g>
  <g transform="translate(580 130)">
    <rect width="180" height="40" rx="8" fill="#fff" stroke="#d97706"/>
    <text x="90" y="25" text-anchor="middle" font-size="13" fill="#92400e">Low-code Factor Dev</text>
  </g>

  <!-- Arrow 4↑3 -->
  <line x1="450" y1="200" x2="450" y2="220" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="465" y="215" font-size="11" fill="#6b7280">uses</text>

  <!-- Layer 3: LLM -->
  <rect x="60" y="225" width="780" height="105" rx="14" fill="url(#g3)" stroke="#2563eb" stroke-width="1.5"/>
  <text x="80" y="253" font-size="13" font-weight="700" fill="#1e40af">③ LLM LAYER</text>
  <g transform="translate(80 270)">
    <rect width="220" height="45" rx="8" fill="#fff" stroke="#2563eb"/>
    <text x="110" y="20" text-anchor="middle" font-size="12" fill="#1e40af">Pre-trained base</text>
    <text x="110" y="36" text-anchor="middle" font-size="11" fill="#1e40af">LLaMA / ChatGLM / GPT-NeoX...</text>
  </g>
  <g transform="translate(335 270)">
    <rect width="220" height="45" rx="8" fill="#fff" stroke="#2563eb"/>
    <text x="110" y="20" text-anchor="middle" font-size="12" fill="#1e40af">+ LoRA / QLoRA</text>
    <text x="110" y="36" text-anchor="middle" font-size="11" fill="#1e40af">参数 -250×, 显存 -10×</text>
  </g>
  <g transform="translate(590 270)">
    <rect width="220" height="45" rx="8" fill="#fff" stroke="#2563eb"/>
    <text x="110" y="20" text-anchor="middle" font-size="12" fill="#1e40af">+ RLSP fine-tuning</text>
    <text x="110" y="36" text-anchor="middle" font-size="11" fill="#1e40af">用 ±2% 股价波动当 label</text>
  </g>

  <!-- Arrow 3↑2 -->
  <line x1="450" y1="350" x2="450" y2="370" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="465" y="365" font-size="11" fill="#6b7280">trained on</text>

  <!-- Layer 2: Data Curation -->
  <rect x="60" y="375" width="780" height="100" rx="14" fill="url(#g2)" stroke="#16a34a" stroke-width="1.5"/>
  <text x="80" y="403" font-size="13" font-weight="700" fill="#166534">② DATA CURATION LAYER</text>
  <g transform="translate(80 420)">
    <rect width="240" height="45" rx="8" fill="#fff" stroke="#16a34a"/>
    <text x="120" y="20" text-anchor="middle" font-size="12" fill="#166534">Cleaning（白 / 链 / 字 / 词）</text>
    <text x="120" y="36" text-anchor="middle" font-size="11" fill="#166534">逐 doc 内部修整（4 步）</text>
  </g>
  <g transform="translate(345 420)">
    <rect width="240" height="45" rx="8" fill="#fff" stroke="#16a34a"/>
    <text x="120" y="20" text-anchor="middle" font-size="12" fill="#166534">Filtering（长 / 特 / 重 / 惑 / 复）</text>
    <text x="120" y="36" text-anchor="middle" font-size="11" fill="#166534">全集中删除（5 类）</text>
  </g>
  <g transform="translate(610 420)">
    <rect width="200" height="45" rx="8" fill="#fff" stroke="#16a34a"/>
    <text x="100" y="20" text-anchor="middle" font-size="12" fill="#166534">Tokenization</text>
    <text x="100" y="36" text-anchor="middle" font-size="11" fill="#166534">用 HF pre-trained</text>
  </g>

  <!-- Arrow 2↑1 -->
  <line x1="450" y1="495" x2="450" y2="515" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="465" y="510" font-size="11" fill="#6b7280">feeds from</text>

  <!-- Layer 1: Data Source -->
  <rect x="60" y="520" width="780" height="90" rx="14" fill="url(#g1)" stroke="#dc2626" stroke-width="1.5"/>
  <text x="80" y="548" font-size="13" font-weight="700" fill="#991b1b">① DATA SOURCE LAYER · 34 sources, unified API (date_range / streaming)</text>
  <g transform="translate(80 562)">
    <rect width="170" height="40" rx="8" fill="#fff" stroke="#dc2626"/>
    <text x="85" y="18" text-anchor="middle" font-size="12" fill="#991b1b">News (19)</text>
    <text x="85" y="33" text-anchor="middle" font-size="10" fill="#991b1b">Yahoo / FMP / Eastmoney…</text>
  </g>
  <g transform="translate(265 562)">
    <rect width="170" height="40" rx="8" fill="#fff" stroke="#dc2626"/>
    <text x="85" y="18" text-anchor="middle" font-size="12" fill="#991b1b">Social Media (8)</text>
    <text x="85" y="33" text-anchor="middle" font-size="10" fill="#991b1b">Twitter / Reddit / Weibo…</text>
  </g>
  <g transform="translate(450 562)">
    <rect width="160" height="40" rx="8" fill="#fff" stroke="#dc2626"/>
    <text x="80" y="18" text-anchor="middle" font-size="12" fill="#991b1b">Filings (3)</text>
    <text x="80" y="33" text-anchor="middle" font-size="10" fill="#991b1b">SEC / Juchao / Astock</text>
  </g>
  <g transform="translate(625 562)">
    <rect width="200" height="40" rx="8" fill="#fff" stroke="#dc2626"/>
    <text x="100" y="18" text-anchor="middle" font-size="12" fill="#991b1b">Research Datasets (4)</text>
    <text x="100" y="33" text-anchor="middle" font-size="10" fill="#991b1b">FPB / FiQA SA / Stocknet…</text>
  </g>
</svg>
